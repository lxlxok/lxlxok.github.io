# Site settings
title: Schrödinger's Cat
SEOTitle: xiao's Blog
header-img: img/cat.png
email: ""
description: "xiao's Blog."
keyword: "xiao's blog, Schrödinger's Cat, kubernetes, cloud native, golang, distributed system"
url: "https://www.gitluck.com"              # your host, for absolute URL
baseurl: ""         # for example, '/blog' if your blog hosted on 'host/blog'
timezone: America/Los_Angeles



# SNS settings
RSS: false
#weibo_username:     huxpro
#zhihu_username:     huxpro
